<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>ICT Convergence Security Event Archive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between relative">

  <!-- 상단 공식 헤더 (토글 스위치 적용) -->
  <div class="bg-white border-b border-slate-200 py-3 px-4 sm:px-6 shadow-sm sticky top-0 z-30">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-2 sm:gap-4 md:gap-6">
        <a href="https://www.kisia.or.kr/ks/kisia_index.php" target="_blank" rel="noopener noreferrer" class="shrink-0 transition-transform hover:scale-105" title="한국정보보호산업협회 바로가기">
          <img src="logo-kisia.png" alt="한국정보보호산업협회" class="h-5 sm:h-6 md:h-8 object-contain" />
        </a>
        <div class="h-3 sm:h-4 w-[1px] bg-slate-300 shrink-0"></div>
        <a href="https://kiceclass.kisia.or.kr/app/page/fdd957c0-c00d-46bb-b8ac-5991a6a292f0" target="_blank" rel="noopener noreferrer" class="shrink-0 transition-transform hover:scale-105" title="ICT 융합 산업보안 인력양성사업 바로가기">
          <img src="logo-ict.png" alt="ICT 융합 산업보안 인력양성사업" class="h-4 sm:h-5 md:h-7 object-contain" />
        </a>
      </div>

      <!-- 토글 스위치 버튼 -->
      <div class="bg-slate-100 p-1 rounded-full flex items-center shadow-inner border border-slate-200 shrink-0">
        <a href="index.html" class="px-3.5 py-1.5 rounded-full text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
          크루 아카이브
        </a>
        <a href="seminar.html" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-white text-emerald-700 shadow-sm transition">
          이벤트 아카이브
        </a>
      </div>
    </div>
  </div>

  <!-- Hero Section -->
  <header id="top-header" class="bg-gradient-to-r from-slate-900 via-slate-800 to-emerald-950 text-white py-10 sm:py-12 px-4 sm:px-6 shadow-md">
    <div class="max-w-6xl mx-auto flex flex-col lg:flex-row lg:items-center justify-between gap-6 lg:gap-10">
      <div class="w-full">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-[10px] sm:text-xs font-semibold mb-3 border border-emerald-400/30">
          <i class="fa-solid fa-file-shield"></i> ICT Convergence Security Event Archive
        </div>
        <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-extrabold tracking-tight break-keep">
          ICT Convergence Security Event Archive
        </h1>
      </div>

      <!-- 회차 선택 전역 필터 -->
      <div class="bg-white/10 backdrop-blur-md p-3 sm:p-4 rounded-2xl border border-white/20 w-full lg:w-auto shrink-0 overflow-x-auto">
        <span class="text-[11px] sm:text-xs text-slate-300 font-medium block mb-2 px-1">행사 회차 선택</span>
        <div class="flex items-center gap-1.5 whitespace-nowrap" id="seminar-round-filters"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10 flex-grow w-full space-y-8" id="seminar-main-container">
    <div class="py-20 text-center text-slate-400 text-sm">
      <i class="fa-solid fa-spinner fa-spin mr-2"></i> 세미나 정보를 불러오는 중입니다...
    </div>
  </main>

  <!-- 우측 하단 플로팅 퀵 메뉴 -->
  <aside class="fixed bottom-6 right-6 z-40 flex flex-col gap-2 shadow-xl rounded-2xl p-1.5 bg-white/90 backdrop-blur-md border border-slate-200">
    <a href="#top-header" title="맨 위로 이동" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition text-xs">
      <i class="fa-solid fa-arrow-up"></i>
    </a>
    <a href="index.html" title="크루 활동관으로 이동" class="w-10 h-10 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-600 flex items-center justify-center transition text-xs font-bold">
      <i class="fa-solid fa-laptop-code"></i>
    </a>
  </aside>

  <!-- 원본 사진 확대 뷰어 (Lightbox) -->
  <div id="lightbox-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4" onclick="closeLightbox()">
    <button onclick="closeLightbox()" class="absolute top-5 right-5 text-white/70 hover:text-white text-2xl w-10 h-10 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 transition">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="max-w-5xl max-h-[85vh] flex flex-col items-center justify-center p-2" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="원본 사진" class="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl" />
      <p id="lightbox-caption" class="text-white/80 text-xs sm:text-sm mt-3 text-center px-4"></p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-200 bg-white py-8 px-6 text-xs text-slate-500 mt-16">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4 opacity-75">
        <img src="logo-kisia.png" alt="한국정보보호산업협회" class="h-6 object-contain grayscale" />
        <img src="logo-ict.png" alt="ICT 융합 산업보안 인력양성사업" class="h-5 object-contain grayscale" />
      </div>
      <p class="text-center md:text-right">© 2026 KISIA 한국정보보호산업협회. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Script -->
  <script>
    const SEMINAR_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSX8ZG1BwtKpvS72k4ut88Nf2gdn9PP78EFKjedj9_s56NuOeYLpsxcmG8L4pTPWjGIuNy0xpTCnsBt/pub?gid=1085601582&single=true&output=csv";

    let seminarData = [];
    let currentRound = '';

    function formatDriveImageUrl(url) {
      if (!url) return '';
      const cleanUrl = url.trim();
      const match = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || cleanUrl.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1200`;
      }
      return cleanUrl;
    }

    // 유튜브 153 오류 방지를 위해 nocookie 도메인 적용
    function getYoutubeEmbedUrl(url) {
      if (!url) return '';
      const cleanUrl = url.trim();
      let videoId = '';
      if (cleanUrl.includes('youtu.be/')) {
        videoId = cleanUrl.split('youtu.be/')[1]?.split('?')[0];
      } else if (cleanUrl.includes('watch?v=')) {
        videoId = cleanUrl.split('watch?v=')[1]?.split('&')[0];
      } else if (cleanUrl.includes('embed/')) {
        videoId = cleanUrl.split('embed/')[1]?.split('?')[0];
      }
      return videoId ? `https://www.youtube-nocookie.com/embed/${videoId}` : '';
    }

    function fetchSheetData(url) {
      return new Promise((resolve, reject) => {
        Papa.parse(url, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: results => resolve(results.data),
          error: err => reject(err)
        });
      });
    }

    async function initSeminarArchive() {
      try {
        seminarData = await fetchSheetData(SEMINAR_CSV_URL);
        setupRoundFilters();
      } catch (error) {
        console.error("데이터 로드 실패:", error);
        document.getElementById('seminar-main-container').innerHTML = `
          <div class="py-12 text-center text-red-500 text-xs">데이터 로드에 실패했습니다. 구글 시트 웹 게시 상태를 확인해주세요.</div>
        `;
      }
    }

    function setupRoundFilters() {
      const rounds = [...new Set(seminarData.map(d => d.round).filter(Boolean))];
      rounds.reverse();

      if (rounds.length === 0) {
        document.getElementById('seminar-main-container').innerHTML = `<div class="py-12 text-center text-slate-400 text-xs">등록된 세미나 데이터가 없습니다.</div>`;
        return;
      }

      currentRound = rounds[0];
      renderRoundButtons(rounds);
      renderSeminarDetail(currentRound);
    }

    function renderRoundButtons(rounds) {
      const container = document.getElementById('seminar-round-filters');
      container.innerHTML = rounds.map(r => `
        <button onclick="switchRound('${r}')" class="round-filter-btn px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${r === currentRound ? 'bg-emerald-600 text-white shadow-sm' : 'bg-white/20 text-white hover:bg-white/30'}">
          ${r}
        </button>
      `).join('');
    }

    function switchRound(round) {
      currentRound = round;
      const buttons = document.querySelectorAll('.round-filter-btn');
      buttons.forEach(btn => {
        if (btn.innerText.trim() === round) {
          btn.className = 'round-filter-btn px-3.5 py-1.5 rounded-lg text-xs font-bold bg-emerald-600 text-white shadow-sm';
        } else {
          btn.className = 'round-filter-btn px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white/20 text-white hover:bg-white/30 transition';
        }
      });
      renderSeminarDetail(round);
    }

    function renderSeminarDetail(round) {
      const container = document.getElementById('seminar-main-container');
      const matches = seminarData.filter(d => d.round === round);
      const mainInfo = matches[0] || {};

      const posterUrl = formatDriveImageUrl(mainInfo.posterUrl) || 'https://placehold.co/600x800?text=Poster';
      const overviewText = mainInfo.overview || '행사 개요 및 소개 내용이 입력되지 않았습니다.';
      const eventTitle = mainInfo.title || round;
      const embedUrl = getYoutubeEmbedUrl(mainInfo.videoUrl);

      let galleryImgs = [];
      let galleryCaps = [];
      matches.forEach(item => {
        if (item.galleryImages) {
          const imgs = item.galleryImages.split(',').map(s => formatDriveImageUrl(s)).filter(Boolean);
          galleryImgs.push(...imgs);
        }
        if (item.galleryCaptions) {
          const caps = item.galleryCaptions.split(',').map(s => s.trim());
          galleryCaps.push(...caps);
        }
      });

      container.innerHTML = `
        <!-- 1. 행사명 박스 -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 text-center">
          <span class="text-xs font-bold text-emerald-600 uppercase tracking-widest block mb-1">${round}</span>
          <h2 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">${eventTitle}</h2>
        </div>

        <!-- 2. 포스터 이미지 & 행사 개요 2단 레이아웃 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
          <div class="lg:col-span-5 bg-white rounded-3xl border border-slate-200 shadow-sm p-4 flex items-center justify-center cursor-pointer group" onclick="openLightbox('${posterUrl}', '${encodeURIComponent(eventTitle)}')">
            <div class="relative w-full h-[400px] flex items-center justify-center bg-slate-100 rounded-2xl overflow-hidden">
              <img src="${posterUrl}" alt="행사 포스터" class="max-h-full max-w-full object-contain group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/600x800?text=Poster'" />
              <div class="absolute inset-0 bg-slate-950/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-semibold">
                <i class="fa-solid fa-expand mr-1.5"></i> 포스터 원본 보기
              </div>
            </div>
          </div>

          <div class="lg:col-span-7 bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8 flex flex-col justify-between">
            <div>
              <h3 class="text-base font-bold text-slate-900 border-b border-slate-100 pb-3 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-circle-info text-emerald-600"></i> 행사 개요 및 안내
              </h3>
              <div class="text-xs sm:text-sm text-slate-600 leading-relaxed whitespace-pre-line">
                ${overviewText}
              </div>
            </div>
            <div class="mt-6 pt-4 border-t border-slate-100 text-[11px] text-slate-400 flex items-center justify-between">
              <span>KISIA 한국정보보호산업협회</span>
              <span>ICT융합산업보안 인력양성</span>
            </div>
          </div>
        </div>

        <!-- 3. 프로그램 안내 (타임테이블) -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden p-6 sm:p-8 space-y-6">
          <div class="border-b border-slate-100 pb-4">
            <h3 class="text-lg sm:text-xl font-bold text-slate-900 flex items-center gap-2">
              <span class="text-emerald-600"><i class="fa-solid fa-timeline"></i></span> 프로그램 안내
            </h3>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-600">
              <thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase">
                <tr>
                  <th scope="col" class="py-3.5 px-4">시간</th>
                  <th scope="col" class="py-3.5 px-4">세션명</th>
                  <th scope="col" class="py-3.5 px-4">연사이름 / 소속</th>
                  <th scope="col" class="py-3.5 px-4 text-center">발표자료</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${matches.map(item => item.sessionTitle ? `
                  <tr class="hover:bg-slate-50 transition-colors">
                    <td class="py-4 px-4 whitespace-nowrap text-xs font-bold text-slate-700">${item.time || '-'}</td>
                    <td class="py-4 px-4 font-semibold text-slate-900">${item.sessionTitle}</td>
                    <td class="py-4 px-4 text-xs text-slate-600">${item.speaker || '-'}</td>
                    <td class="py-4 px-4 text-center whitespace-nowrap">
                      ${item.pdfUrl && item.pdfUrl.trim() !== '' && item.pdfUrl !== '#' ? `
                        <a href="${item.pdfUrl}" target="_blank" title="발표자료 PDF 다운로드/보기" class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 transition inline-flex items-center justify-center shadow-sm">
                          <i class="fa-solid fa-file-pdf text-sm"></i>
                        </a>
                      ` : '<span class="text-xs text-slate-300">-</span>'}
                    </td>
                  </tr>
                ` : '').join('')}
              </tbody>
            </table>
          </div>
        </div>

        <!-- 4. 슬라이드 형식으로 FLOW 되는 이미지 갤러리 -->
        ${galleryImgs.length > 0 ? `
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
              <h3 class="text-lg sm:text-xl font-bold text-slate-900 flex items-center gap-2">
                <span class="text-emerald-600"><i class="fa-solid fa-images"></i></span> 현장 스케치 갤러리
              </h3>
              <div class="flex items-center gap-2">
                <button onclick="scrollGallery(-1)" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-emerald-600 hover:text-white text-slate-700 flex items-center justify-center transition shadow-sm">
                  <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button onclick="scrollGallery(1)" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-emerald-600 hover:text-white text-slate-700 flex items-center justify-center transition shadow-sm">
                  <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
              </div>
            </div>

            <div id="gallery-slider" class="flex gap-4 overflow-x-auto no-scrollbar scroll-smooth py-2">
              ${galleryImgs.map((img, idx) => `
                <div class="shrink-0 w-72 sm:w-80 flex flex-col space-y-2">
                  <div class="bg-slate-900 text-white text-center text-[11px] font-bold py-1.5 px-3 rounded-lg shadow-sm truncate">
                    ${galleryCaps[idx] || `현장 스케치 (${idx + 1})`}
                  </div>
                  <div class="h-52 rounded-2xl overflow-hidden border border-slate-200 bg-slate-100 cursor-pointer relative group"
                       onclick="openLightbox('${img}', '${encodeURIComponent(galleryCaps[idx] || '현장 사진')}')">
                    <img src="${img}" alt="현장 사진" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/600x400?text=Photo'" />
                    <div class="absolute inset-0 bg-slate-950/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs">
                      <i class="fa-solid fa-expand mr-1"></i> 원본 확대
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- 5. 유튜브 영상 올리기 영역 -->
        ${embedUrl ? `
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-4">
            <h3 class="text-lg sm:text-xl font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-4">
              <span class="text-red-600"><i class="fa-brands fa-youtube"></i></span> 다시보기
            </h3>
            <div class="relative w-full pt-[56.25%] rounded-2xl overflow-hidden border border-slate-200 bg-black shadow-inner">
              <iframe src="${embedUrl}" class="absolute inset-0 w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
          </div>
        ` : ''}
      `;
    }

    function scrollGallery(direction) {
      const slider = document.getElementById('gallery-slider');
      if (slider) {
        slider.scrollBy({ left: direction * 340, behavior: 'smooth' });
      }
    }

    function openLightbox(imgUrl, encodedCaption) {
      const caption = decodeURIComponent(encodedCaption || '');
      document.getElementById('lightbox-img').src = imgUrl;
      document.getElementById('lightbox-caption').innerText = caption;
      document.getElementById('lightbox-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    window.addEventListener('DOMContentLoaded', initSeminarArchive);
  </script>
</body>
</html>
