<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICT융합보안크루 아카이브</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', sans-serif; }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- 상단 공식 헤더 (로고 영역) -->
  <div class="bg-white border-b border-slate-200 py-3 px-6 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3 sm:gap-6">
        <img src="logo-kisia.png" alt="한국정보보호산업협회" class="h-6 sm:h-8 object-contain" />
        <div class="h-4 w-[1px] bg-slate-200"></div>
        <img src="logo-ict.png" alt="ICT 융합 산업보안 인력양성사업" class="h-5 sm:h-7 object-contain" />
      </div>
      <!-- 네비게이션 메뉴 전환 -->
      <nav class="flex items-center gap-2 text-xs font-semibold">
        <a href="index.html" class="px-3.5 py-1.5 bg-blue-50 text-blue-700 rounded-lg border border-blue-200 font-bold">크루 활동관</a>
        <a href="seminar.html" class="px-3.5 py-1.5 text-slate-600 hover:text-blue-600 rounded-lg transition">세미나 자료실</a>
      </nav>
    </div>
  </div>

  <!-- Hero Section -->
  <header class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white py-12 px-6 shadow-md">
    <div class="max-w-6xl mx-auto">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 text-xs font-semibold mb-3 border border-blue-400/30">
        <i class="fa-solid fa-user-graduate"></i> Youth & Convergence Security Talent
      </div>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">ICT융합보안크루 아카이브</h1>
      <p class="mt-2 text-slate-300 text-sm md:text-base">차세대 산업보안을 이끄는 크루원들의 활동 발자취와 팀 프로젝트 연구 산출물을 기록합니다.</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-6 py-10 flex-grow w-full space-y-6">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-4">
      <div>
        <h2 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
          <span class="text-blue-600"><i class="fa-solid fa-users"></i></span> 활동 타임라인 & 프로젝트 성과
        </h2>
        <p class="text-sm text-slate-500 mt-1">기수를 선택하여 활동 내역과 상세 산출물을 확인하세요.</p>
      </div>
      <!-- 기수 탭 필터 -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1" id="crew-gen-filters">
        <button onclick="filterCrew('ALL')" class="crew-filter-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white shadow-sm">전체</button>
      </div>
    </div>

    <!-- 카드 그리드 -->
    <div id="crew-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full py-16 text-center text-slate-400 text-sm">
        <i class="fa-solid fa-spinner fa-spin mr-2"></i> 크루 활동 데이터를 불러오는 중입니다...
      </div>
    </div>
  </main>

  <!-- 상세 보기 팝업 모달 -->
  <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 sm:p-8 shadow-2xl relative animate-in fade-in zoom-in duration-200">
      <button onclick="closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 text-lg w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-100 transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-200 bg-white py-8 px-6 text-xs text-slate-500 mt-16">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4 opacity-75">
        <img src="logo-kisia.png" alt="한국정보보호산업협회" class="h-6 object-contain grayscale" />
        <img src="logo-ict.png" alt="ICT 융합 산업보안 인력양성사업" class="h-5 object-contain grayscale" />
      </div>
      <p class="text-center md:text-right">© 2026 KISIA 한국정보보호산업협회. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Script -->
  <script>
    const CREW_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSX8ZG1BwtKpvS72k4ut88Nf2gdn9PP78EFKjedj9_s56NuOeYLpsxcmG8L4pTPWjGIuNy0xpTCnsBt/pub?gid=0&single=true&output=csv";

    let crewData = [];
    let currentGenFilter = 'ALL';

    function fetchSheetData(url) {
      return new Promise((resolve, reject) => {
        Papa.parse(url, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: results => resolve(results.data),
          error: err => reject(err)
        });
      });
    }

    async function initCrewArchive() {
      try {
        crewData = await fetchSheetData(CREW_CSV_URL);
        setupCrewFilters();
        renderCrewCards();
      } catch (error) {
        console.error("데이터 로드 실패:", error);
        document.getElementById('crew-grid').innerHTML = `
          <div class="col-span-full p-6 bg-red-50 border border-red-200 rounded-xl text-center text-red-600 text-xs">
            데이터를 불러오지 못했습니다. 스프레드시트 설정을 확인해주세요.
          </div>
        `;
      }
    }

    function setupCrewFilters() {
      const container = document.getElementById('crew-gen-filters');
      const gens = [...new Set(crewData.map(d => d.gen).filter(Boolean))].sort().reverse();
      
      let html = `<button onclick="filterCrew('ALL')" class="crew-filter-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white shadow-sm">전체</button>`;
      gens.forEach(gen => {
        html += `<button onclick="filterCrew('${gen}')" class="crew-filter-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm">${gen}</button>`;
      });
      container.innerHTML = html;
    }

    function filterCrew(gen) {
      currentGenFilter = gen;
      const buttons = document.querySelectorAll('.crew-filter-btn');
      buttons.forEach(btn => {
        if (btn.innerText.trim() === gen || (gen === 'ALL' && btn.innerText.trim() === '전체')) {
          btn.className = 'crew-filter-btn px-3.5 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white shadow-sm';
        } else {
          btn.className = 'crew-filter-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 shadow-sm';
        }
      });
      renderCrewCards();
    }

    function renderCrewCards() {
      const grid = document.getElementById('crew-grid');
      const filtered = currentGenFilter === 'ALL' ? crewData : crewData.filter(item => item.gen === currentGenFilter);

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 text-xs">등록된 활동 내역이 없습니다.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const isBest = String(item.isBest).toUpperCase() === 'TRUE';
        const originalIndex = crewData.indexOf(item);

        return `
          <div class="bg-white rounded-xl border border-slate-200 p-5 flex flex-col justify-between hover:shadow-md transition-shadow relative">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200">${item.gen || ''} · ${item.category || ''}</span>
                ${isBest ? '<span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-50 text-amber-600 border border-amber-200"><i class="fa-solid fa-award mr-1"></i>우수작</span>' : ''}
              </div>
              <span class="text-xs font-semibold text-blue-600 tracking-wide uppercase">[${item.domain || '일반'}]</span>
              <h3 class="text-base font-bold text-slate-900 mt-1 leading-snug">${item.title || ''}</h3>
              <p class="text-xs text-slate-500 mt-2 line-clamp-2 leading-relaxed">${item.description || ''}</p>
              ${item.team ? `<p class="text-[11px] text-slate-400 mt-2"><i class="fa-solid fa-users text-[10px] mr-1"></i>${item.team}</p>` : ''}
            </div>
            <div class="pt-4 mt-4 border-t border-slate-100 flex items-center justify-between text-xs">
              <span class="text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>${item.date || ''}</span>
              <button onclick="openModal(${originalIndex})" class="font-semibold text-blue-600 hover:text-blue-800 flex items-center gap-1.5 transition">
                <span>자세히 보기</span> <i class="fa-solid fa-circle-info text-[11px]"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(index) {
      const item = crewData[index];
      if (!item) return;

      const isBest = String(item.isBest).toUpperCase() === 'TRUE';
      const content = document.getElementById('modal-content');
      const detailDescription = item.modalDesc && item.modalDesc.trim() !== '' ? item.modalDesc : item.description;
      const customLinkLabel = item.linkLabel && item.linkLabel.trim() !== '' ? item.linkLabel : '산출물 바로가기';

      content.innerHTML = `
        <div class="flex items-center gap-2 mb-3">
          <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-slate-100 text-slate-700 border border-slate-200">${item.gen || ''} · ${item.category || ''}</span>
          ${isBest ? '<span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-50 text-amber-600 border border-amber-200"><i class="fa-solid fa-award mr-1"></i>우수작</span>' : ''}
        </div>
        <span class="text-xs font-semibold text-blue-600 tracking-wide uppercase">[${item.domain || '일반'}]</span>
        <h3 class="text-xl font-extrabold text-slate-900 mt-1 leading-snug">${item.title || ''}</h3>
        
        <div class="my-4 p-3.5 bg-slate-50 rounded-xl text-xs space-y-1.5 text-slate-600 border border-slate-100">
          <div><span class="text-slate-400 font-medium w-16 inline-block">활동 일자:</span> ${item.date || '-'}</div>
          ${item.team ? `<div><span class="text-slate-400 font-medium w-16 inline-block">참여 대상:</span> ${item.team}</div>` : ''}
          ${item.modalMentor ? `<div><span class="text-slate-400 font-medium w-16 inline-block">지도/멘토:</span> <span class="font-semibold text-slate-700">${item.modalMentor}</span></div>` : ''}
          ${item.modalHighlight ? `<div><span class="text-slate-400 font-medium w-16 inline-block">주요 성과:</span> <span class="text-blue-700 font-semibold">${item.modalHighlight}</span></div>` : ''}
        </div>

        <div class="space-y-1.5 my-4">
          <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">상세 내용</h4>
          <div class="text-sm text-slate-600 whitespace-pre-line leading-relaxed max-h-60 overflow-y-auto pr-2">
            ${detailDescription || '등록된 상세 설명이 없습니다.'}
          </div>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-end gap-2.5">
          <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition">닫기</button>
          ${item.link && item.link.trim() !== '' && item.link !== '#' ? `
            <a href="${item.link}" target="_blank" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 shadow-sm transition">
              <span>${customLinkLabel}</span> <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          ` : ''}
        </div>
      `;

      document.getElementById('detail-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    window.addEventListener('click', (e) => {
      const modal = document.getElementById('detail-modal');
      if (e.target === modal) closeModal();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    window.addEventListener('DOMContentLoaded', initCrewArchive);
  </script>
</body>
</html>
